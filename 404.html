<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>成都房产 CRM · 客户管理</title>
<meta name="robots" content="noindex, nofollow">
<script>
  // SPA 回退：把 /crm/xxx 转发回 /crm/ 并把原路径交给前端恢复
  var p = location.pathname + location.search + location.hash;
  location.replace('/crm/?redirect=' + encodeURIComponent(p));
</script>
</head>

</html>
